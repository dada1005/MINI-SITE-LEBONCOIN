<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANNONCE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">LeBoncoin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="home.html"><i class="bi bi-house-door"></i>
                            Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-bell"></i> Annonce</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="seDeconnecter.html"><i class="bi bi-power"></i> Se Déconnecter</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <button class="btn btn-secondary m-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample"
        aria-controls="offcanvasExample">
        <i class="bi bi-plus-circle ms-2"></i> Déposez une annonce
    </button>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
        <div class="offcanvas-header">
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="affichage">
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Titre</label>
                    <input type="text" class="form-control" id="idTitre" rows="3" placeholder="titre">
                    <span id="msgTitre" class="text-danger"></span>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Type d'annonces</label>
                    <select class="form-select" aria-label="Default select example" id="idType">
                        <option>Offre</option>
                        <option>Demande</option>
                    </select>
                    <span id="msgType" class="text-danger"></span>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Catégorie</label>
                    <select class="form-select" aria-label="Default select example" id="idCategorie">
                        <option>Immobilier</option>
                        <option>Véhicule</option>
                        <option>Maison</option>
                        <option>Mode</option>
                        <option>Famille</option>
                        <option>Electronique</option>
                        <option>Loisir</option>
                    </select>
                    <span id="msgCategorie" class="text-danger"></span>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Ajout d'images</label>
                    <input type="file" class="form-control" id="idImage" rows="3" placeholder="png/jpg">
                    <img id="idPhoto" class="img-fluid mt-3" style="min-width: 250px; display:none;">
                    <span id="msgImage" class="text-danger"></span>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Description</label>
                    <span id="msgDescription" class="text-danger"></span>
                    <textarea class="form-control" id="idDescription" rows="3"
                        placeholder="ajouter une description"></textarea>
                </div>
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Prix</label>
                    <input type="number" class="form-control" id="idPrix" rows="3" placeholder=" prix ($)">
                    <span id="msgPrix" class="text-danger"></span>
                </div>
                <button type="button" class="btn btn-secondary" id="idAjouter">Ajouter</button>
                <br>
                <span id="msgAnnonce"></span>
            </div>
        </div>
    </div>
    <div id="divAnnonces"></div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="JS/annonce.js"></script>
</body>

</html>
